<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeiBox Logo · 均衡圆角 留白修正</title>
<style>
  :root { --ink: #111; --muted: #6b6b6b; --line: #e4e4e4; --ok: #1a7f37; --bad: #c62828; --dark: #1f2a44; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink); background: #fafafa; font-size: 14px; line-height: 1.55;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 40px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  .lead { margin: 0; color: var(--muted); font-size: 13px; max-width: 560px; }
  .status { margin: 6px 0 0; font-size: 13px; font-weight: 600; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar span { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; font-size: 13px; color: var(--ink); background: #fff;
    border: 1px solid #cfcfcf; border-radius: 8px; padding: 6px 12px; min-height: 34px; cursor: pointer;
  }
  button:hover { border-color: #888; }
  button:focus-visible, summary:focus-visible { outline: 2px solid #2f6fed; outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .panel p { margin: 0; color: var(--muted); font-size: 12px; }
  .stage { border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; padding: 16px; }
  .stage svg { display: block; }
  .hero svg { width: 100%; max-width: 440px; height: auto; aspect-ratio: 1 / 1; }
  .sizes { display: flex; justify-content: center; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .size { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .size span { font-size: 11px; color: var(--muted); }
  .bg-dark .stage { background: var(--dark); border-color: var(--dark); }
  .bg-dark .size span { color: #c9cfdc; }
  .bg-white .stage { background: #fff; }
  .notes { margin: 16px 0 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .notes ul { margin: 6px 0 0; padding-left: 18px; }
  details { margin-top: 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  .table-wrap { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }
  .checks { margin: 10px 0 0; padding-left: 18px; font-size: 12px; }
  .checks .ok { color: var(--ok); } .checks .bad { color: var(--bad); }
  @media (max-width: 680px) {
    .wrap { padding: 18px 14px 32px; }
    .compare { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="bg-white">
<div class="wrap">
  <header>
    <div>
      <h1>均衡圆角 · 留白修正</h1>
      <p class="lead">外壳与 viewBox 不变。L 两臂同步缩短到 119，整体沿盒子右下边向左下平移，横臂圆头离开右下大圆角。</p>
      <p class="status" id="status" aria-live="polite">校验中…</p>
    </div>
    <div class="toolbar">
      <div class="toolbar" role="group" aria-label="预览背景">
        <span>背景</span>
        <button type="button" data-bg="white" aria-pressed="true">白色</button>
        <button type="button" data-bg="dark" aria-pressed="false">深色</button>
      </div>
      <button type="button" class="primary" id="download">下载修正版 SVG</button>
    </div>
  </header>

  <section class="compare" aria-label="前后对比">
    <article class="panel" aria-labelledby="h-original">
      <h2 id="h-original">原版</h2>
      <p>臂长 140 · 线宽 54 · 圆端/圆转角</p>
      <div class="stage hero" data-slot="original-hero"></div>
      <div class="stage sizes" data-slot="original-sizes" aria-label="原版使用尺寸"></div>
    </article>
    <article class="panel" aria-labelledby="h-revised">
      <h2 id="h-revised">留白修正版</h2>
      <p>臂长 119 · 线宽 54 · 圆端/圆转角 · 左下平移</p>
      <div class="stage hero" data-slot="revised-hero"></div>
      <div class="stage sizes" data-slot="revised-sizes" aria-label="修正版使用尺寸"></div>
    </article>
  </section>

  <section class="notes" aria-label="主要变化">
    <strong>主要变化</strong>
    <ul>
      <li>两臂中心线 140 → 119，仍 1 : 1 等长，线宽与半圆头半径 27 不变。</li>
      <li>L 沿右下边方向平移（x −8，y +8/√3），下方黑边保持不变。</li>
      <li>横臂圆头到外壳右下圆角的黑边明显加厚，和下方留白接近。</li>
    </ul>
  </section>

  <details>
    <summary>详细测量与断言</summary>
    <div class="table-wrap"><table id="measure"></table></div>
    <ul class="checks" id="checks"></ul>
  </details>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 锁定输入 ---------- */
  var SHELL_D = 'M212 59.403 A88 88 0 0 1 300 59.403 L404.258 119.597 A88 88 0 0 1 448.258 195.807 L448.258 316.193 A88 88 0 0 1 404.258 392.403 L300 452.597 A88 88 0 0 1 212 452.597 L107.742 392.403 A88 88 0 0 1 63.742 316.193 L63.742 195.807 A88 88 0 0 1 107.742 119.597 Z';
  var ORIGINAL_LD_LITERAL = 'M282 248 L282 388 L403.244 318';
  var VIEWBOX = [0, 0, 512, 512];
  var STROKE_WIDTH = 54;
  var ANGLE_DEG = -30;

  var SPECS = {
    original: { label: '原版', elbow: { x: 282, y: 388 }, length: 140, strokeWidth: STROKE_WIDTH, precision: 3, trim: true },
    revised:  { label: '留白修正版', elbow: { x: 274, y: 388 + 8 / Math.sqrt(3) }, length: 119, strokeWidth: STROKE_WIDTH, precision: 9, trim: false }
  };

  /* ---------- 数学工具 ---------- */
  function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
  function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
  function mul(a, k) { return { x: a.x * k, y: a.y * k }; }
  function dot(a, b) { return a.x * b.x + a.y * b.y; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function fmt(n, p, trim) { var s = n.toFixed(p); return trim ? String(Number(s)) : s; }

  // 从外壳原始 path 解析：每段圆弧（半径、端点、sweep=1）求圆心；圆心即“内缩六边形”顶点
  function parseShell(d) {
    var tokens = d.match(/[MLAZ]|-?\d*\.?\d+/g);
    var i = 0, cur = null, arcs = [], cmd;
    function num() { return Number(tokens[i++]); }
    while (i < tokens.length) {
      cmd = tokens[i++];
      if (cmd === 'M' || cmd === 'L') { cur = { x: num(), y: num() }; }
      else if (cmd === 'A') {
        var rx = num(); num(); num(); num(); var sweep = num();
        var end = { x: num(), y: num() };
        var mid = mul(add(cur, end), 0.5), chord = sub(end, cur), half = Math.hypot(chord.x, chord.y) / 2;
        var h = Math.sqrt(Math.max(0, rx * rx - half * half));
        var n = { x: -chord.y / (2 * half), y: chord.x / (2 * half) };   // 屏幕坐标下 sweep=1（顺时针）圆心在弦的右手侧
        var c = sweep === 1 ? add(mid, mul(n, h)) : sub(mid, mul(n, h));
        arcs.push({ start: cur, end: end, r: rx, center: c });
        cur = end;
      }
    }
    return arcs;
  }

  function segDist(p, a, b) {
    var ab = sub(b, a), t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / dot(ab, ab)));
    return dist(p, add(a, mul(ab, t)));
  }
  function signedDistConvex(p, poly) {
    var inside = true, m = Infinity;
    for (var k = 0; k < poly.length; k++) {
      var a = poly[k], b = poly[(k + 1) % poly.length];
      if ((b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) < 0) inside = false;
      m = Math.min(m, segDist(p, a, b));
    }
    return inside ? -m : m;
  }
  // 圆角凸六边形 = 圆心六边形 ⊕ 半径 r 圆盘：点到外壳边界距离 = r − 点到圆心六边形的有符号距离
  function shellClearance(p, arcs) {
    return arcs[0].r - signedDistConvex(p, arcs.map(function (a) { return a.center; }));
  }

  var ARCS = parseShell(SHELL_D);

  /* ---------- 唯一参数函数：几何 + SVG ---------- */
  function computeGeometry(spec) {
    var rad = ANGLE_DEG * Math.PI / 180;
    var E = { x: spec.elbow.x, y: spec.elbow.y };
    var A = add(E, { x: 0, y: -spec.length });
    var B = add(E, { x: spec.length * Math.cos(rad), y: spec.length * Math.sin(rad) });
    var p = spec.precision, t = spec.trim;
    var lD = 'M' + fmt(A.x, p, t) + ' ' + fmt(A.y, p, t) +
             ' L' + fmt(E.x, p, t) + ' ' + fmt(E.y, p, t) +
             ' L' + fmt(B.x, p, t) + ' ' + fmt(B.y, p, t);
    // 以实际写入 SVG 的坐标测量（渲染即此值）
    var n = lD.match(/-?\d*\.?\d+/g).map(Number);
    var rA = { x: n[0], y: n[1] }, rE = { x: n[2], y: n[3] }, rB = { x: n[4], y: n[5] };
    var cap = spec.strokeWidth / 2;
    var rcCenter = ARCS[2].center;   // 右下圆角
    return {
      elbow: rE, A: rA, B: rB,
      length: spec.length,
      strokeWidth: spec.strokeWidth,
      capRadius: cap,
      verticalLength: dist(rA, rE),
      diagonalLength: dist(rE, rB),
      shellD: SHELL_D,
      lD: lD,
      viewBox: VIEWBOX.join(' '),
      rightGap: shellClearance(rB, ARCS) - cap,           // 横臂圆头 → 外壳边界（实为右下圆角）
      rightGapToCornerArc: ARCS[2].r - dist(rB, rcCenter) - cap,
      bottomGap: shellClearance(rE, ARCS) - cap,          // 转角圆 → 外壳边界（右下直边）
      topGap: shellClearance(rA, ARCS) - cap,
      exact: { elbow: E, A: A, B: B }
    };
  }

  function buildSvg(spec, maskId, size) {
    var g = computeGeometry(spec);
    var wh = size ? ' width="' + size + '" height="' + size + '"' : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + g.viewBox + '"' + wh + ' role="img" aria-label="LeiBox">' +
      '<title>LeiBox</title>' +
      '<defs><mask id="' + maskId + '" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">' +
        '<rect x="0" y="0" width="512" height="512" fill="#fff"/>' +
        '<path data-role="l-centerline" d="' + g.lD + '" fill="none" stroke="#000" stroke-width="' + g.strokeWidth + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</mask></defs>' +
      '<path d="' + g.shellD + '" fill="#000" mask="url(#' + maskId + ')"/>' +
      '</svg>';
  }

  /* ---------- 计算与断言 ---------- */
  var original = computeGeometry(SPECS.original);
  var revised = computeGeometry(SPECS.revised);
  var originalSvg = buildSvg(SPECS.original, 'leibox-original-mask');
  var revisedSvg = buildSvg(SPECS.revised, 'leibox-mask');
  var revisedPreview = buildSvg(SPECS.revised, 'p-revised-hero');

  function decimalsOK(d, min) {
    return d.match(/-?\d*\.?\d+/g).every(function (s) { var dot = s.indexOf('.'); return dot >= 0 && s.length - dot - 1 >= min; });
  }
  var checks = [
    ['外壳 path 与锁定字符串一致', original.shellD === SHELL_D && revised.shellD === SHELL_D && revisedSvg.indexOf('d="' + SHELL_D + '"') > 0],
    ['原版 L 与给定 path 一致', original.lD === ORIGINAL_LD_LITERAL],
    ['外壳由 6 段 r=88 圆弧构成', ARCS.length === 6 && ARCS.every(function (a) { return a.r === 88; })],
    ['右下圆角圆心 ≈ (360.258, 316.193)', Math.abs(ARCS[2].center.x - 360.258) < 1e-3 && Math.abs(ARCS[2].center.y - 316.193) < 1e-3],
    ['修正版两臂等长 119', Math.abs(revised.verticalLength - 119) < 1e-8 && Math.abs(revised.diagonalLength - 119) < 1e-8],
    ['修正版坐标 ≥ 9 位小数', decimalsOK(revised.lD, 9)],
    ['线宽 54 / 圆头半径 27 未变', revised.strokeWidth === 54 && revised.capRadius === 27 && original.strokeWidth === 54],
    ['平移量 = (−8, +8/√3)，沿右下边方向', Math.abs(revised.exact.elbow.x - original.exact.elbow.x + 8) < 1e-12 &&
      Math.abs(revised.exact.elbow.y - original.exact.elbow.y - 8 / Math.sqrt(3)) < 1e-12],
    ['下方留白不变（外壳坐标为三位小数，容差 1e-3）', Math.abs(revised.bottomGap - original.bottomGap) < 1e-3],
    ['右端黑边 ≥ 下方黑边 − 1', revised.rightGap >= revised.bottomGap - 1],
    ['L 完全在外壳内（所有端点间距 > 0）', revised.rightGap > 0 && revised.bottomGap > 0 && revised.topGap > 0],
    ['预览与导出 SVG 同源', revisedPreview.split('p-revised-hero').join('ID') === revisedSvg.split('leibox-mask').join('ID')],
    ['viewBox 保持 0 0 512 512', revisedSvg.indexOf('viewBox="0 0 512 512"') > 0 && originalSvg.indexOf('viewBox="0 0 512 512"') > 0]
  ];
  var allPass = checks.every(function (c) { return c[1]; });
  checks.forEach(function (c) { console.assert(c[1], '断言失败: ' + c[0]); });

  window.logoRevision = {
    originalSvg: originalSvg,
    revisedSvg: revisedSvg,
    original: original,
    revised: revised,
    specs: SPECS,
    shellArcs: ARCS,
    checks: checks.map(function (c) { return { name: c[0], pass: c[1] }; }),
    allPass: allPass,
    buildSvg: function (which, maskId) { return buildSvg(SPECS[which], maskId || 'leibox-mask'); }
  };

  /* ---------- 渲染 ---------- */
  function slot(name) { return document.querySelector('[data-slot="' + name + '"]'); }
  slot('original-hero').innerHTML = buildSvg(SPECS.original, 'p-original-hero');
  slot('revised-hero').innerHTML = revisedPreview;
  ['original', 'revised'].forEach(function (k) {
    slot(k + '-sizes').innerHTML = [24, 48, 96].map(function (s) {
      return '<div class="size">' + buildSvg(SPECS[k], 'p-' + k + '-' + s, s) + '<span>' + s + 'px</span></div>';
    }).join('');
  });

  function n3(v) { return v.toFixed(3); }
  function pt(p) { return '(' + n3(p.x) + ', ' + n3(p.y) + ')'; }
  var rows = [
    ['', '原版', '修正版'],
    ['转角 elbow', pt(original.elbow), pt(revised.elbow)],
    ['竖臂端 A', pt(original.A), pt(revised.A)],
    ['斜臂端 B', pt(original.B), pt(revised.B)],
    ['竖臂 / 斜臂长度', n3(original.verticalLength) + ' / ' + n3(original.diagonalLength), n3(revised.verticalLength) + ' / ' + n3(revised.diagonalLength)],
    ['线宽 · 圆头半径', '54 · 27', '54 · 27'],
    ['右端黑边 rightGap', n3(original.rightGap), n3(revised.rightGap)],
    ['下方黑边 bottomGap', n3(original.bottomGap), n3(revised.bottomGap)],
    ['顶端黑边', n3(original.topGap), n3(revised.topGap)],
    ['L path', '<code>' + original.lD + '</code>', '<code>' + revised.lD + '</code>']
  ];
  document.getElementById('measure').innerHTML = rows.map(function (r, i) {
    var tag = i === 0 ? 'th' : 'td';
    return '<tr><th>' + r[0] + '</th><' + tag + '>' + r[1] + '</' + tag + '><' + tag + '>' + r[2] + '</' + tag + '></tr>';
  }).join('');
  document.getElementById('checks').innerHTML = checks.map(function (c) {
    return '<li class="' + (c[1] ? 'ok' : 'bad') + '">' + (c[1] ? '✓ ' : '✗ ') + c[0] + '</li>';
  }).join('');
  var st = document.getElementById('status');
  st.className = 'status ' + (allPass ? 'ok' : 'bad');
  st.textContent = allPass
    ? '断言全部通过 · 右端黑边 ' + n3(original.rightGap) + ' → ' + n3(revised.rightGap) + '，下方 ' + n3(revised.bottomGap)
    : '有断言未通过，展开下方测量查看';

  /* ---------- 交互 ---------- */
  document.getElementById('download').addEventListener('click', function () {
    var text = '<?xml version="1.0" encoding="UTF-8"?>\n' + window.logoRevision.revisedSvg + '\n';
    var url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'leibox-logo-balanced-revised.svg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
  var bgButtons = document.querySelectorAll('[data-bg]');
  bgButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      document.body.className = 'bg-' + b.getAttribute('data-bg');
      bgButtons.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
  });
})();
</script>
</body>
</html>
