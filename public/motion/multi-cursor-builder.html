.mc-scene{--ink:#111214;--ink2:#55585f;--ink3:#8b8e95;--line:#ececee;--blue:#0d99ff;--serif:'LeiBoxBuilderSerif',Georgia,serif;--sans:LeiBoxBuilderInter,-apple-system,'Segoe UI',system-ui,sans-serif;--mono:'LeiBoxBuilderMono',ui-monospace,Menlo,monospace}\r
*{box-sizing:border-box;margin:0;padding:0}\r
.mc-port{background:#e7e7e9}\r
.mc-document{font-family:var(--sans);color:var(--ink);min-height:100%;background:#e7e7e9 radial-gradient(#cfcfd3 1px,transparent 1.2px) 0 0/22px 22px;-webkit-font-smoothing:antialiased;overflow-x:hidden}\r
.mc-port.lock{overflow:hidden}\r
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}\r
#logo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:16px;background:#111214;color:#fff;font:italic 38px/58px var(--serif);text-align:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.18)}\r
.flabel{max-width:1160px;margin:56px auto 8px;padding:0 2px;font:500 11.5px var(--sans);color:#8a8c92;display:flex;gap:8px;opacity:0;transition:opacity .4s}\r
.flabel b{color:#5d6066;font-weight:500}\r
.wrap{position:relative;max-width:1160px;margin:0 auto 140px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 40px rgba(0,0,0,.05);padding:28px 72px 40px}\r
.b{opacity:0}\r
nav{display:flex;align-items:center;justify-content:space-between;height:44px}\r
.brand{font:500 15px var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}\r
.brand i{width:26px;height:26px;border-radius:8px;background:#111214;color:#fff;font:italic 19px/26px var(--serif);text-align:center;font-style:italic}\r
.links{display:flex;gap:28px;font-size:13.5px;color:var(--ink2)}.links a{color:inherit;text-decoration:none}\r
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#1c6b3c;background:#eaf7ef;border:1px solid #cfeedd;padding:6px 12px;border-radius:99px}\r
.pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#22a55a;box-shadow:0 0 0 3px rgba(34,165,90,.18)}\r
.hero{padding:76px 0 36px}\r
.kick{width:max-content;font:500 12px var(--mono);color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}\r
h1{font:400 82px/1.0 var(--serif);letter-spacing:-.025em;margin-top:18px;max-width:880px}\r
h1 em,h2 em{font-style:italic;color:#5b5ff0}\r
.lead{font-size:18px;line-height:1.6;color:var(--ink2);max-width:600px;margin-top:22px}\r
.ctas{display:flex;gap:12px;margin-top:30px;width:max-content}\r
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;background:#111214;color:#fff;font:500 14px var(--sans);text-decoration:none}\r
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #dcdce0}\r
.heroimg{margin-top:48px;height:420px;border-radius:20px;overflow:hidden;background:#d9d9d9;position:relative}\r
.art{display:block;width:100%;height:100%;object-fit:cover;opacity:0}\r
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}\r
.stat{border:1px solid var(--line);border-radius:16px;padding:20px 22px}\r
.stat b{display:block;font:400 40px/1 var(--serif);letter-spacing:-.02em}.stat span{display:block;margin-top:8px;font-size:13px;color:var(--ink3)}\r
section{padding:64px 0 8px;border-top:1px solid var(--line);margin-top:56px}\r
h2{font:400 52px/1.05 var(--serif);letter-spacing:-.02em;margin-top:12px;max-width:760px}\r
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}\r
.card{border-radius:18px;overflow:hidden;background:transparent}\r
.card .th{height:260px;position:relative;background:#d9d9d9;border-radius:18px 18px 0 0}\r
.card .meta{background:#fff;padding:16px 18px 18px;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;opacity:0;transition:opacity .25s}\r
.card.ok .meta{opacity:1}\r
.meta h4{font:500 16px var(--sans);display:flex;justify-content:space-between}.meta h4 span{font:500 12px var(--mono);color:var(--ink3)}\r
.meta p{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}\r
.row{display:grid;grid-template-columns:200px 1fr 130px;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}\r
.row .co{font:400 26px/1 var(--serif)}.row .t{font-weight:500;font-size:15px}.row .d{color:var(--ink2);font-size:14px;margin-top:6px;line-height:1.5}.row .y{font:500 12px var(--mono);color:var(--ink3);text-align:right;padding-top:4px}\r
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;max-width:860px}\r
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border:1px solid #e3e3e7;border-radius:10px;font-size:14px;background:#fff;opacity:0}\r
.chip i{width:9px;height:9px;border-radius:3px}\r
.heat{display:grid;grid-template-columns:repeat(53,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:32px;padding:22px;border:1px solid var(--line);border-radius:16px}\r
.heat span{aspect-ratio:1;border-radius:3px;opacity:0}\r
.heatcap{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--ink3);margin-top:12px}\r
.contact .kick{margin:0 auto}.contact{text-align:center;padding:90px 0 40px}\r
.contact h2{font-size:72px;margin:14px auto 0;max-width:820px}\r
.contact .ctas{margin:30px auto 0}\r
footer{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);padding-top:28px;margin-top:60px;border-top:1px solid var(--line)}\r
.caret{display:inline-block;width:1.5px;height:1em;background:#111;vertical-align:-.12em;margin:0 -.75px;animation:bl 1s steps(1) infinite}\r
@keyframes bl{50%{opacity:0}}\r
.inv{visibility:hidden}\r
.raw{font-family:var(--sans)!important;font-size:15px!important;line-height:1.35!important;letter-spacing:0!important;font-weight:400!important;color:#111!important}\r
.raw em{font-style:normal!important;color:#111!important}\r
.morph{transition:font-size .5s cubic-bezier(.2,.8,.2,1),line-height .5s,letter-spacing .5s,color .3s}\r
#bar{position:fixed;z-index:60;left:50%;bottom:18px;transform:translate(-50%,24px);opacity:0;transition:.6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:6px;padding:6px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.12);font:500 12px var(--sans);color:#333}\r
#bar.on{opacity:1;transform:translate(-50%,0)}\r
#bar .tool{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#333}\r
#bar .tool.on{background:var(--blue);color:#fff}\r
#bar .sep{width:1px;height:22px;background:#e6e6e8;margin:0 4px}\r
#bar .av{display:flex;padding:0 6px}#bar .av span{width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-left:-6px;font:600 10px/20px var(--sans);color:#fff;text-align:center}\r
#bar button{height:34px;padding:0 14px;border-radius:9px;border:0;background:#f1f1f3;font:500 12.5px var(--sans);cursor:pointer;color:#222}\r
#bar button:hover{background:#e6e6ea}\r
@container (max-width:900px){.wrap{padding:24px 24px}h1{font-size:52px}.grid,.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.links{display:none}.contact h2{font-size:48px}}\r

    <div class="row b" data-k="carry" data-n="Row"><div class="co">Pantoria</div><div><div class="t">Lead Motion Developer</div><div class="d">Owned the interaction layer and launch visuals across the product line.</div></div><div class="y">2022 \u2014 2024</div></div>\r
