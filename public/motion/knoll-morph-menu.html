<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knoll Morph Menu</title>
  <style>
    :root {
      --bg-sky: #707574;
      --shell-bg: #1b1d1d;
      --shell-border: rgba(255, 255, 255, 0.14);
      --panel-bg: #303030;
      --panel-bg-hover: #3d3d3d;
      --preview-bg: #101010;
      --text-primary: #f5f5f5;
      --text-muted: #9a9a9a;
      --text-dim: #9a9a9a;
      --watermark: rgba(255, 255, 255, 0.24);
      --copyright: #a0a0a0;
      --outer-radius: 18px;
      --inner-radius: 11px;
      --shell-pad: 9px;
      --ease-text: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-sky);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 530px;
      container-type: inline-size;
      background:
        radial-gradient(120% 90% at 50% 0%, #767b7a 0%, #707574 58%, #696e6d 100%);
    }

    .menu-anchor {
      position: absolute;
      top: 23px;
      left: clamp(12px, 4cqi, 42px);
      z-index: 50;
      --brand-width: 118;
      --menu-height: 436;
      --preview-height: 436;
    }

    .morph-shell {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 188px;
      height: 70px;
      padding: var(--shell-pad);
      border-radius: var(--outer-radius);
      background-color: var(--shell-bg);
      border: 1px solid var(--shell-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      overflow: hidden;
      will-change: width, height;
    }

    .brand-col {
      flex: 0 0 calc(var(--brand-width) * 1px);
      display: flex;
      align-items: flex-start;
      padding: 13px 0 0 11px;
    }

    .brand-link {
      display: inline-flex;
      align-items: baseline;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.2;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .nav-surface {
      position: relative;
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      border-radius: var(--inner-radius);
      background-color: var(--panel-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 240ms ease;
      will-change: width, height;
    }

    .nav-surface.is-hover-bg {
      background-color: var(--panel-bg-hover);
    }

    .menu-toggle {
      position: relative;
      flex: 0 0 50px;
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .menu-toggle:focus-visible {
      box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.5);
      border-radius: var(--inner-radius);
    }

    .toggle-label {
      position: absolute;
      left: 22px;
      top: 50%;
      font-size: 19px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0;
      transform: translate3d(-8px, -50%, 0);
      pointer-events: none;
      white-space: nowrap;
      will-change: transform, opacity;
      transition: color 220ms ease;
    }

    .morph-shell.is-expanded-ui .toggle-label {
      color: var(--text-muted);
      font-size: 18px;
    }

    .toggle-icon-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      pointer-events: none;
    }

    .toggle-icon {
      position: relative;
      width: 14px;
      height: 14px;
      display: block;
      color: var(--text-primary);
      will-change: transform;
      transition: color 220ms ease;
    }

    .morph-shell.is-expanded-ui .toggle-icon {
      color: var(--text-muted);
    }

    .morph-shell.is-expanded-ui .menu-toggle:hover .toggle-label,
    .morph-shell.is-expanded-ui .menu-toggle:hover .toggle-icon {
      color: var(--text-primary);
    }

    .nav-body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 22px 22px 22px;
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .nav-body.is-interactive {
      pointer-events: auto;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 4px 0;
      font-family: inherit;
      font-size: 22px;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      cursor: pointer;
      transition: color 240ms var(--ease-text);
    }

    .nav-list.has-hover .nav-item-btn {
      color: var(--text-dim);
    }

    .nav-list.has-hover .nav-item-btn.is-hovered {
      color: #ffffff;
    }

    .nav-item-btn:focus-visible {
      outline: 1.5px solid rgba(255, 255, 255, 0.5);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .legal-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 16px;
    }

    .legal-btn {
      display: inline-block;
      width: fit-content;
      background: none;
      border: none;
      padding: 1px 0;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 180ms ease;
    }

    .legal-btn:hover,
    .legal-btn:focus-visible {
      color: var(--text-primary);
    }

    .preview-panel {
      position: relative;
      flex: 0 0 auto;
      width: 0;
      height: calc(var(--preview-height) * 1px);
      margin-left: 0;
      border-radius: var(--inner-radius);
      background-color: var(--preview-bg);
      overflow: hidden;
      opacity: 0;
      will-change: width, margin-left, opacity;
    }

    .preview-default {
      position: absolute;
      inset: 0;
      width: var(--preview-content-width, 291px);
      height: calc(var(--preview-height) * 1px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px 18px 18px;
      background-color: var(--preview-bg);
      z-index: 1;
    }

    .preview-watermark {
      font-size: 46px;
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--watermark);
      white-space: nowrap;
    }

    .preview-copyright {
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: -0.01em;
      color: var(--copyright);
      white-space: nowrap;
    }

    .preview-cards {
      position: absolute;
      inset: 0;
      width: var(--preview-content-width, 291px);
      height: calc(var(--preview-height) * 1px);
      z-index: 2;
      pointer-events: none;
    }

    .preview-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: var(--inner-radius);
      overflow: hidden;
      transform: translate3d(0, 102%, 0);
      will-change: transform;
      background-color: #161616;
    }

    .preview-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.06);
      will-change: transform;
    }

    .preview-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(8, 9, 10, 0.86) 0%,
        rgba(8, 9, 10, 0.48) 32%,
        rgba(8, 9, 10, 0.08) 58%,
        rgba(8, 9, 10, 0) 100%
      );
      pointer-events: none;
    }

    .card-caption {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-kicker {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.56);
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      filter: blur(2.5px);
      transition:
        opacity 340ms var(--ease-text),
        transform 400ms var(--ease-text),
        filter 340ms ease;
    }

    .preview-card.is-text-on .card-kicker {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      filter: blur(0);
      transition-delay: 80ms;
    }

    .card-desc {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.32;
      letter-spacing: -0.02em;
      color: #f7f7f7;
    }

    .card-desc .word {
      display: inline-block;
      opacity: 0;
      transform: translate3d(0, 7px, 0);
      filter: blur(3px);
      transition:
        opacity 340ms var(--ease-text),
        transform 420ms var(--ease-text),
        filter 340ms ease;
      margin-right: 0.26em;
    }

    .preview-card.is-text-on .card-desc .word {
      opacity: 1;
      transform: translate3d(0, 0, 0);
      filter: blur(0);
    }

    .nav-toast {
      position: absolute;
      left: clamp(12px, 4cqi, 42px);
      bottom: 14px;
      max-width: calc(100% - 24px);
      z-index: 60;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(27, 29, 29, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-primary);
      font-size: 13.5px;
      letter-spacing: -0.01em;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translate3d(0, 10px, 0);
      pointer-events: none;
      transition: opacity 240ms ease, transform 300ms var(--ease-text);
    }

    .nav-toast.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }


    .toggle-icon::before, .toggle-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 1.5px;
      border-radius: 1px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .toggle-icon::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .brand-link:focus-visible, .legal-btn:focus-visible {
      outline: 2px solid #bdbdbd;
      outline-offset: 3px;
      border-radius: 3px;
    }

    @container (max-width: 670px) {
      .menu-anchor {
        top: 14px;
        --brand-width: 82;
        --menu-height: 330;
        --preview-height: 140;
      }

      .brand-col { padding-left: 4px; }
      .nav-body { padding: 3px 12px 0; }
      .nav-list { gap: 0; }
      .nav-item-btn { min-height: 36px; padding: 0; font-size: 17px; }
      .legal-links { gap: 0; padding-top: 8px; }
      .legal-btn { min-height: 26px; }
      .preview-panel { position: absolute; left: 9px; margin-left: 0; }
      .preview-watermark { font-size: 34px; }
      .preview-copyright { font-size: 12px; }
      .card-caption { left: 12px; right: 12px; bottom: 12px; }
      .card-desc { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; }
    }

    :host([data-reduced-motion=true]) .card-desc .word { transition-delay: 0s !important; }
  </style>
</head>
<body>
  <div class="stage">
    <nav class="menu-anchor" aria-label="Knoll navigation demo">
      <div class="morph-shell" id="morphShell" data-state="collapsed">
        <div class="brand-col">
          <button type="button" class="brand-link" id="brandBtn" aria-label="Knoll Home">
            Knoll®
          </button>
        </div>
        <div class="nav-surface" id="navSurface">
          <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-expanded="false"
            aria-controls="navBody"
            aria-label="Toggle navigation menu"
          >
            <span class="toggle-label" id="toggleLabel">Menu</span>
            <span class="toggle-icon-wrap" id="toggleIconWrap" aria-hidden="true">
              <span class="toggle-icon" id="toggleIcon"></span>
            </span>
          </button>

          <div class="nav-body" id="navBody" aria-hidden="true" inert>
            <ul class="nav-list" id="navList" role="list">
              <li><button type="button" class="nav-item-btn" data-key="home">Home</button></li>
              <li><button type="button" class="nav-item-btn" data-key="studio">Studio</button></li>
              <li><button type="button" class="nav-item-btn" data-key="projects">Projects</button></li>
              <li><button type="button" class="nav-item-btn" data-key="services">Services</button></li>
              <li><button type="button" class="nav-item-btn" data-key="journal">Journal</button></li>
              <li><button type="button" class="nav-item-btn" data-key="contact">Contact</button></li>
            </ul>

            <div class="legal-links">
              <button type="button" class="legal-btn" data-legal="Privacy Policy">Privacy Policy</button>
              <button type="button" class="legal-btn" data-legal="Terms &amp; Conditions">Terms &amp; Conditions</button>
            </div>
          </div>
        </div>
        <div class="preview-panel" id="previewPanel" aria-hidden="true">
          <div class="preview-default">
            <div class="preview-watermark">Knoll©</div>
            <div class="preview-copyright">
              © 2026 Knoll.<br />
              All Rights Reserved.
            </div>
          </div>
          <div class="preview-cards" id="previewCards"></div>
        </div>
      </div>
    </nav>

    <div class="nav-toast" id="navToast" role="status" aria-live="polite"></div>
  </div>

    const description = document.createElement("div");
    description.className = "card-desc";
    for (const [index, word] of item.desc.split(" ").entries()) {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = word;
      span.style.transitionDelay = (115 + index * 62) + "ms";
      description.appendChild(span);
    }
    caption.append(kicker, description);
    card.append(image, caption);
    cards.appendChild(card);
    const position = spring(102, 260, 32);
    springs.push(position);
    cardData.set(item.key, { card, image, position });
  }

  let layout;
  let state = "collapsed";
  let overToggle = false;
  let pointerItem = null;
  let touchItem = null;
  let activeItem = null;
  let layer = 0;
  let stageTimer;
  let toastTimer;
  let frame = null;
  let lastTime = 0;

  function render() {
    const { brand, previewWidth, previewHeight, stacked } = layout;
    const w = Math.max(50, navWidth.value);
    const h = Math.max(50, navHeight.value);
    const p = Math.max(0, Math.min(1, panelProgress.value));
    const sideWidth = previewWidth * p;
    const gap = 9 * Math.min(1, sideWidth / 24);
    shell.style.width = (brand + w + 20 + (stacked ? 0 : sideWidth + gap)) + "px";
    shell.style.height = (h + 20 + (stacked ? (previewHeight + 9) * p : 0)) + "px";
    navSurface.style.width = w + "px";
    navSurface.style.height = h + "px";
    panel.style.width = (stacked ? previewWidth : sideWidth) + "px";
    panel.style.top = stacked ? (h + 18) + "px" : "";
    panel.style.marginLeft = stacked ? "0px" : gap + "px";
    panel.style.opacity = Math.min(1, p * 1.6);
    panel.style.setProperty("--preview-content-width", previewWidth + "px");

    label.style.opacity = labelProgress.value;
    label.style.transform = `translate3d(${-8 * (1 - labelProgress.value)}px, -50%, 0)`;
    iconWrap.style.transform = `translate3d(${iconX.value}px, 0, 0)`;
    icon.style.transform = `rotate(${iconAngle.value}deg)`;
    body.style.opacity = bodyProgress.value;
    body.style.transform = `translate3d(0, ${10 * (1 - bodyProgress.value)}px, 0)`;

    for (const [key, { card, image, position }] of cardData) {
      if (activeItem && activeItem !== key && position.target === 0 && cardData.get(activeItem).position.value < 0.6) {
        position.value = position.target = 102;
        position.velocity = 0;
      }
      card.style.transform = `translate3d(0, ${position.value}%, 0)`;
      image.style.transform = `scale(${1 + 0.055 * Math.max(0, Math.min(1, position.value / 102))})`;
    }
  }

  function animate(immediate = false) {
    if (immediate || reduced()) {
      if (frame !== null) cancelFrame(frame);
      frame = null;
      for (const item of springs) {
        item.value = item.target;
        item.velocity = 0;
      }
      render();
    } else if (frame === null) {
      lastTime = view.performance.now();
      frame = requestFrame(tick);
    }
  }

  function tick(now) {
    frame = null;
    if (reduced()) {
      animate(true);
      return;
    }
    const elapsed = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    const steps = Math.ceil(elapsed / 0.008);
    const dt = elapsed / steps;
    lastTime = now;
    let moving = false;
    for (const item of springs) {
      for (let index = 0; index < steps; index++) {
        const force = item.stiffness * (item.target - item.value) - item.damping * item.velocity;
        item.velocity += force * dt;
        item.value += item.velocity * dt;
      }
      if (Math.abs(item.target - item.value) < 0.04 && Math.abs(item.velocity) < 0.08) {
        item.value = item.target;
        item.velocity = 0;
      } else {
        moving = true;
      }
    }
    render();
    if (moving) frame = requestFrame(tick);
  }

  function applyTargets(immediate) {
    const expanded = state !== "collapsed";
    const hint = !expanded && (overToggle || toggle.matches(":focus-visible"));
    shell.dataset.state = state;
    shell.classList.toggle("is-expanded-ui", expanded);
    navSurface.classList.toggle("is-hover-bg", hint);
    navWidth.target = expanded ? layout.width : hint ? 143 : 50;
    navHeight.target = expanded ? layout.height : 50;
    panelProgress.target = Number(state === "open");
    labelProgress.target = Number(expanded || hint);
    bodyProgress.target = Number(expanded);
    iconX.target = expanded ? 76 : hint ? 93 : 0;
    iconAngle.target = expanded ? 45 : 0;
    animate(immediate);
  }

  function measure() {
    const style = view.getComputedStyle(anchor);
    const brand = Number(style.getPropertyValue("--brand-width"));
    const height = Number(style.getPropertyValue("--menu-height"));
    const previewHeight = Number(style.getPropertyValue("--preview-height"));
    const stacked = height !== previewHeight;
    const available = stage.clientWidth - 2 * anchor.offsetLeft - 20;
    const width = Math.max(50, Math.min(271, available - brand));
    const previewWidth = stacked ? brand + width : Math.min(291, available - brand - width - 9);
    if (layout?.width === width && layout.height === height && layout.previewWidth === previewWidth) return;
    layout = { brand, width, height, previewWidth, previewHeight, stacked };
    applyTargets(true);
  }

  function preview(key) {
    if (state !== "open" || activeItem === key) return;
    activeItem = key;
    list.classList.toggle("has-hover", Boolean(key));
    for (const button of buttons) button.classList.toggle("is-hovered", button.dataset.key === key);
    for (const [id, { card, position }] of cardData) {
      const active = id === key;
      card.classList.toggle("is-text-on", active);
      if (active) {
        card.style.zIndex = String(++layer);
        position.target = 0;
      } else if (!key) {
        position.target = 102;
      }
    }
    animate();
  }

  function focusedItem() {
    const focused = document.activeElement;
    return focused?.matches(".nav-item-btn:focus-visible") ? focused.dataset.key : null;
  }

  function openMenu() {
    clearTimeout(stageTimer);
    state = "opening-v";
    toggle.setAttribute("aria-expanded", "true");
    body.setAttribute("aria-hidden", "false");
    body.inert = false;
    body.classList.add("is-interactive");
    applyTargets();
    const showPanel = () => {
      state = "open";
      applyTargets();
      preview(touchItem ?? pointerItem ?? focusedItem());
    };
    if (reduced()) showPanel();
    else stageTimer = setTimeout(showPanel, 460);
  }

  function closeMenu() {
    if (state === "collapsed" || state === "closing-h") return;
    clearTimeout(stageTimer);
    if (body.contains(document.activeElement)) toggle.focus();
    toggle.setAttribute("aria-expanded", "false");
    body.setAttribute("aria-hidden", "true");
    body.inert = true;
    body.classList.remove("is-interactive");
    preview(null);
    pointerItem = touchItem = null;
    const finish = () => {
      state = "collapsed";
      applyTargets();
    };
    if (state === "open" && !reduced()) {
      state = "closing-h";
      applyTargets();
      stageTimer = setTimeout(finish, 360);
    } else {
      finish();
    }
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
  }

  on(navSurface, "pointerenter", event => {
    if (event.pointerType === "touch") return;
    overToggle = true;
    if (state === "collapsed") applyTargets();
  });
  on(navSurface, "pointerleave", () => {
    overToggle = false;
    if (state === "collapsed") applyTargets();
  });
  for (const type of ["focus", "blur"]) on(toggle, type, () => {
    if (state === "collapsed") applyTargets();
  });
  on(toggle, "click", () => {
    if (state === "collapsed" || state === "closing-h") openMenu();
    else closeMenu();
  });

  for (const [index, button] of buttons.entries()) {
    const { key, label, desc } = ITEMS[index];
    button.setAttribute("aria-description", desc);
    on(button, "pointerenter", event => {
      if (event.pointerType === "touch") return;
      pointerItem = key;
      preview(key);
    });
    on(button, "focus", () => {
      if (button.matches(":focus-visible")) preview(key);
    });
    on(button, "click", event => {
      if (event.pointerType === "touch" && touchItem !== key) {
        touchItem = key;
        preview(key);
      } else {
        closeMenu();
        showToast(label + " — " + desc);
      }
    });
  }
  on(list, "pointerleave", event => {
    if (event.pointerType === "touch") return;
    pointerItem = null;
    preview(focusedItem());
  });
  on(list, "focusout", event => {
    if (!list.contains(event.relatedTarget)) preview(touchItem ?? pointerItem);
  });

  for (const button of shell.querySelectorAll(".legal-btn")) {
    on(button, "click", () => {
      closeMenu();
      showToast(button.dataset.legal);
    });
  }
  on(byId("brandBtn"), "click", () => {
    closeMenu();
    showToast("Knoll® — Home");
  });
  on(document, "click", event => {
    if (!event.composedPath().includes(shell)) closeMenu();
  });
  on(document, "keydown", event => {
    if (event.key === "Escape" && event.composedPath().includes(shell) && !body.inert) {
      closeMenu();
      toggle.focus();
    }
  });

  measure();
  new ResizeObserver(measure).observe(stage);
  return { refresh: () => { if (reduced()) animate(true); } };
}
  </script>
  <script>
(() => {
  const preference = matchMedia("(prefers-reduced-motion: reduce)");
  const menu = mountMenu({
    document,
    on: (target, type, handler) => target.addEventListener(type, handler),
    reduced: () => preference.matches,
    requestFrame: requestAnimationFrame.bind(window),
    cancelFrame: cancelAnimationFrame.bind(window),
    setTimeout: setTimeout.bind(window),
    clearTimeout: clearTimeout.bind(window),
    ResizeObserver,
  });
  preference.addEventListener("change", menu.refresh);
})();
  </script>
</body>
</html>
