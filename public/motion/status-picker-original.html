<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Picker Interaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f5;
      --text: #1c1c1e;
      /* Exact flat solid colors sampled from the reference video */
      --online: #22d44a;
      --focus: #f7c508;
      --dnd: #f26f14;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
    }

    /* Component anchor: dead-center in viewport, smoothly counter-shifts on expand */
    .avatar-cluster {
      position: relative;
      width: 180px;
      height: 180px;
      transform-origin: center center;
      will-change: transform;
    }

    /* Circular illustrated avatar — scales up smoothly (1.20x) when picker opens */
    .avatar-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.09),
        0 4px 12px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      background-color: #e6ebe3;
      transform-origin: center center;
      will-change: transform;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* Morphing Liquid Glass status picker anchored on the top-right shoulder of the avatar */
    .picker-anchor {
      position: absolute;
      left: 114px;
      top: -6px;
      z-index: 20;
      will-change: transform;
    }

    /* Floating morphing Liquid Glass tooltip pill above the expanded picker */
    .tooltip-pill {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 0;
      height: 44px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.96),
        0 0 0 1px rgba(0, 0, 0, 0.075),
        0 6px 18px rgba(0, 0, 0, 0.055);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      will-change: transform, width, opacity, filter;
    }

    /* Crisp directional Liquid Glass refractive rim on tooltip */
    .tooltip-pill::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      padding: 1.25px;
      background: linear-gradient(
        90deg,
        rgba(120, 126, 134, 0.42) 0%,
        rgba(255, 255, 255, 0.92) 22%,
        rgba(255, 255, 255, 0.92) 78%,
        rgba(120, 126, 134, 0.42) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 6;
    }

    .tooltip-text-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      padding: 0 20px;
      transition:
        opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
        filter 220ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }

    .tooltip-text-layer.is-entering {
      opacity: 0;
      filter: blur(4px);
      transform: scale(0.92);
    }

    .tooltip-text-layer.is-visible {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }

    .tooltip-text-layer.is-exiting {
      opacity: 0;
      filter: blur(4px);
      transform: scale(0.92);
    }

    /* Hidden measurer for exact tooltip width */
    .tooltip-measurer {
      position: fixed;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
      display: inline-block;
      white-space: nowrap;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.02em;
      padding: 0 22px;
    }

    /* Outer Liquid Glass morphing pill — airy high-translucency glass + razor-sharp directional rim */
    .picker-shell {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.50);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      box-shadow:
        inset 0 1.5px 1px rgba(255, 255, 255, 0.92),
        inset 0 -1.5px 2px rgba(255, 255, 255, 0.55),
        0 6px 20px rgba(0, 0, 0, 0.045);
      overflow: hidden;
      cursor: pointer;
      will-change: width, height, transform;
    }

    /* Crisp crystalline Liquid Glass directional edge (darker refractive side arcs, bright top/bottom) */
    .picker-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999px;
      padding: 1.35px;
      background: linear-gradient(
        90deg,
        rgba(110, 116, 124, 0.48) 0%,
        rgba(235, 238, 242, 0.78) 18%,
        rgba(255, 255, 255, 0.94) 50%,
        rgba(235, 238, 242, 0.78) 82%,
        rgba(110, 116, 124, 0.48) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 8;
    }

    .picker-shell.is-open {
      cursor: default;
    }

    /* Hit trigger button covering collapsed circle for keyboard accessibility */
    .collapsed-trigger {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      z-index: 10;
      outline: none;
    }

    .collapsed-trigger:focus-visible {
      box-shadow: inset 0 0 0 2.5px rgba(28, 28, 30, 0.35);
    }

    .picker-shell.is-open .collapsed-trigger {
      pointer-events: none;
      display: none;
    }

    /* Pure flat solid colored status circles — ZERO static gloss, dome, or outer glow */
    .status-orb {
      position: absolute;
      left: 0;
      top: 0;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }

    .status-orb[data-status="online"] {
      background-color: var(--online);
    }

    .status-orb[data-status="focus"] {
      background-color: var(--focus);
    }

    .status-orb[data-status="dnd"] {
      background-color: var(--dnd);
    }

    .status-orb:focus-visible {
      box-shadow: 0 0 0 2.5px rgba(28, 28, 30, 0.35);
    }

    .status-orb svg {
      position: relative;
      z-index: 2;
      width: 38px;
      height: 38px;
      display: block;
      color: #ffffff;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Soft wide diagonal light sweep clipped strictly inside the flat circle, ONLY triggered on selection */
    .orb-sheen {
      position: absolute;
      inset: -50%;
      z-index: 3;
      background: linear-gradient(
        130deg,
        rgba(255, 255, 255, 0) 24%,
        rgba(255, 255, 255, 0.72) 50%,
        rgba(255, 255, 255, 0) 76%
      );
      transform: translate3d(-115%, -115%, 0);
      pointer-events: none;
      opacity: 0;
    }

    .orb-sheen.is-sweeping {
      animation: sheenSweep 640ms cubic-bezier(0.25, 0.85, 0.35, 1) forwards;
    }

    @keyframes sheenSweep {
      0% {
        opacity: 0;
        transform: translate3d(-105%, -105%, 0);
      }
      18% {
        opacity: 1;
      }
      82% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(105%, 105%, 0);
      }
    }

    @media (max-width: 560px) {
      .stage {
        padding: 0 12px;
      }
    }
  </style>
</head>

      </div>

      <div class="picker-anchor" id="pickerAnchor">
        <!-- Floating morphing Liquid Glass tooltip pill -->
        <div class="tooltip-pill" id="tooltipPill" aria-hidden="true"></div>

        <!-- Morphing Liquid Glass status pill -->
        <div
          class="picker-shell"
          id="pickerShell"
          role="group"
          aria-label="Status selector"
          data-open="false"
        >
          <button
            type="button"
            class="collapsed-trigger"
            id="collapsedTrigger"
            aria-expanded="false"
            aria-label="Change status (current: Online)"
          ></button>

          <!-- Online (Green) -->
          <button
            type="button"
            class="status-orb"
            data-status="online"
            data-label="Online"
            aria-label="Set status to Online"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 3.5C6.75 3.5 2.5 7.12 2.5 11.6c0 1.98.83 3.8 2.2 5.2-.15 1.25-.67 2.48-1.42 3.36-.18.21-.02.53.26.5 1.85-.2 3.45-.86 4.65-1.66 1.18.39 2.46.6 3.81.6 5.25 0 9.5-3.62 9.5-8.1S17.25 3.5 12 3.5z" />
            </svg>
            <span class="orb-sheen" aria-hidden="true"></span>
          </button>

          <!-- Focus (Yellow) -->
          <button
            type="button"
            class="status-orb"
            data-status="focus"
            data-label="Focus"
            aria-label="Set status to Focus"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <circle cx="12" cy="12" r="5" />
              <circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none" />
            </svg>
            <span class="orb-sheen" aria-hidden="true"></span>
          </button>

          <!-- Do Not Disturb (Orange) -->
          <button
            type="button"
            class="status-orb"
            data-status="dnd"
            data-label="Do Not Disturb"
            aria-label="Set status to Do Not Disturb"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M18.4 15.6c-.7-.8-1.15-2-1.15-3.95V10.5c0-2.66-1.7-4.9-4.1-5.65V4.2a1.15 1.15 0 1 0-2.3 0v.65a5.98 5.98 0 0 0-1.93 1.05l9.48 9.7z"
                fill="currentColor"
              />
              <path
                d="M6.75 9.25v2.4c0 1.95-.45 3.15-1.15 3.95-.4.45-.5.95-.25 1.38.22.38.65.62 1.15.62h9.35L6.75 9.25z"
                fill="currentColor"
              />
              <path
                d="M14.4 18.8a2.45 2.45 0 0 1-4.8 0h4.8z"
                fill="currentColor"
              />
              <path
                d="M4.2 4.2L19.8 19.8"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
              />
            </svg>
            <span class="orb-sheen" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>

    <span class="tooltip-measurer" id="tooltipMeasurer" aria-hidden="true"></span>
  </main>

  <script>
    (function () {
      const STATUSES = ["online", "focus", "dnd"];
      const LABELS = {
        online: "Online",
        focus: "Focus",
        dnd: "Do Not Disturb"
      };

      const avatarCluster = document.getElementById("avatarCluster");
      const avatarWrap = document.getElementById("avatarWrap");
      const pickerAnchor = document.getElementById("pickerAnchor");
      const pickerShell = document.getElementById("pickerShell");
      const collapsedTrigger = document.getElementById("collapsedTrigger");
      const tooltipPill = document.getElementById("tooltipPill");
      const tooltipMeasurer = document.getElementById("tooltipMeasurer");
      const orbButtons = Array.from(document.querySelectorAll(".status-orb"));

      const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Exact proportions from 4x macro inspection of video (dot 63px inside 96px glass ring -> 48px inside 72px)
      const COLLAPSED_W = 72;
      const COLLAPSED_H = 72;
      const COLLAPSED_DOT_SCALE = 48 / 76;

      const EXPANDED_W = 266;
      const EXPANDED_H = 94;
      const ORB_SIZE = 76;
      const ORB_PAD = 9;
      const ORB_GAP = 10;
      const ORB_X = [
        ORB_PAD,
        ORB_PAD + ORB_SIZE + ORB_GAP,
        ORB_PAD + (ORB_SIZE + ORB_GAP) * 2
      ];
      const ORB_Y = (EXPANDED_H - ORB_SIZE) / 2; // 9px exact vertical center

      const AVATAR_EXPAND_SCALE = 1.203;

      const labelWidths = { online: 94, focus: 92, dnd: 168 };
      function measureLabelWidth(key) {
        tooltipMeasurer.textContent = LABELS[key];
        const measured = Math.ceil(tooltipMeasurer.getBoundingClientRect().width);
        const w = Math.max(measured + 10, key === "dnd" ? 164 : 88);
        labelWidths[key] = w;
        return w;
      }
      function measureAllLabels() {
        STATUSES.forEach(measureLabelWidth);
      }
      measureAllLabels();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(measureAllLabels);
      }

      function makeSpring(initial, stiffness, damping) {
        return { val: initial, target: initial, vel: 0, k: stiffness, c: damping };
      }

      function stepSpring(sp, dt) {
        if (reducedMotion) {
          sp.val = sp.target;
          sp.vel = 0;
          return false;
        }
        const accel = -sp.k * (sp.val - sp.target) - sp.c * sp.vel;
        sp.vel += accel * dt;
        sp.val += sp.vel * dt;
        if (Math.abs(sp.val - sp.target) < 0.002 && Math.abs(sp.vel) < 0.01) {
          sp.val = sp.target;
          sp.vel = 0;
          return false;
        }
        return true;
      }

      const spOpen = makeSpring(0, 320, 24);
      const spCollapsedScale = makeSpring(1, 420, 24);
      const orbHoverSprings = STATUSES.map(() => makeSpring(1, 460, 24));

      const spTipOpacity = makeSpring(0, 320, 28);
      const spTipY = makeSpring(8, 320, 26);
      const spTipX = makeSpring(EXPANDED_W / 2, 340, 26);
      const spTipW = makeSpring(labelWidths.focus, 340, 26);

      let isOpen = false;
      let currentStatus = "online";
      let hoveredStatus = null;
      let displayedTooltipLabel = null;
      let rafId = null;
      let lastTime = 0;

      function ensureLoop() {
        if (rafId === null) {
          lastTime = performance.now();
          rafId = requestAnimationFrame(tick);
        }
      }

      function setTooltipText(label) {
        if (!label || displayedTooltipLabel === label) return;
        displayedTooltipLabel = label;

        Array.from(tooltipPill.children).forEach((oldEl) => {
          oldEl.classList.remove("is-visible", "is-entering");
          oldEl.classList.add("is-exiting");
          setTimeout(() => {
            if (oldEl.parentNode === tooltipPill) {
              tooltipPill.removeChild(oldEl);
            }
          }, 250);
        });

        const nextEl = document.createElement("span");
        nextEl.className = "tooltip-text-layer is-entering";
        nextEl.textContent = label;
        tooltipPill.appendChild(nextEl);

        requestAnimationFrame(() => {
          nextEl.classList.remove("is-entering");
          nextEl.classList.add("is-visible");
        });
      }

      function updateTooltipTarget(statusKey) {
        hoveredStatus = statusKey;
        if (!isOpen || !statusKey) {
          spTipOpacity.target = 0;
          spTipY.target = 8;
          tooltipPill.setAttribute("aria-hidden", "true");
          ensureLoop();
          return;
        }

        const idx = STATUSES.indexOf(statusKey);
        const orbCenterX = ORB_X[idx] + ORB_SIZE / 2;
        const targetW = measureLabelWidth(statusKey);
        const blendedCenter = orbCenterX * 0.65 + (EXPANDED_W / 2) * 0.35;
        const clampedCenter = Math.max(targetW / 2 + 2, Math.min(EXPANDED_W - targetW / 2 - 2, blendedCenter));

        if (spTipOpacity.val < 0.05) {
          spTipX.val = clampedCenter;
          spTipX.vel = 0;
          spTipW.val = targetW;
          spTipW.vel = 0;
        }

        spTipX.target = clampedCenter;
        spTipW.target = targetW;
        spTipOpacity.target = 1;
        spTipY.target = 0;
        tooltipPill.setAttribute("aria-hidden", "false");
        setTooltipText(LABELS[statusKey]);
        ensureLoop();
      }

      function triggerSheen(statusKey) {
        const idx = STATUSES.indexOf(statusKey);
        const orb = orbButtons[idx];
        if (!orb) return;
        const sheen = orb.querySelector(".orb-sheen");
        if (!sheen) return;
        sheen.classList.remove("is-sweeping");
        void sheen.offsetWidth;
        sheen.classList.add("is-sweeping");
      }

      function openPicker() {
        if (isOpen) return;
        isOpen = true;
        pickerShell.dataset.open = "true";
        pickerShell.classList.add("is-open");
        collapsedTrigger.setAttribute("aria-expanded", "true");
        orbButtons.forEach((b) => b.setAttribute("tabindex", "0"));
        spOpen.target = 1;
        spCollapsedScale.target = 1;
        ensureLoop();
      }

      function closePicker(selectedKey) {
        if (!isOpen) return;
        const changed = Boolean(selectedKey);
        if (selectedKey) {
          currentStatus = selectedKey;
          collapsedTrigger.setAttribute("aria-label", "Change status (current: " + LABELS[currentStatus] + ")");
        }
        isOpen = false;
        pickerShell.dataset.open = "false";
        pickerShell.classList.remove("is-open");
        collapsedTrigger.setAttribute("aria-expanded", "false");
        orbButtons.forEach((b, i) => {
          b.setAttribute("tabindex", "-1");
          orbHoverSprings[i].target = 1;
        });

        updateTooltipTarget(null);
        spOpen.target = 0;
        ensureLoop();

        if (changed) {
          // Trigger the diagonal white light sweep right as the orb lands in the glass ring
          setTimeout(() => {
            if (!isOpen) triggerSheen(currentStatus);
          }, 180);
        }
      }

      function getResponsiveScale() {
        const vw = window.innerWidth || 800;
        return vw < 480 ? Math.max(0.62, (vw - 36) / 440) : 1;
      }

      function renderFrame() {
        const p = spOpen.val;
        const clampedP = Math.max(0, Math.min(1, p));
        const speed = Math.abs(spOpen.vel);
        const motionBlur = Math.min(4.8, speed * 0.85);
        // Subtle translucent overlap during fast mid-morph (matches reference frame f005)
        const morphAlphaDip = Math.min(0.18, speed * 0.032);
        const respScale = getResponsiveScale();

        // 1. Dynamically keep the whole cluster optically centered
        const clusterShiftX = -74 * p;
        const clusterShiftY = 14 * p;
        avatarCluster.style.transform = `translate3d(${clusterShiftX.toFixed(2)}px, ${clusterShiftY.toFixed(2)}px, 0) scale(${respScale.toFixed(4)})`;

        // 2. Avatar scales up smoothly (1.0 -> 1.203x)
        const avScale = 1 + (AVATAR_EXPAND_SCALE - 1) * p;
        avatarWrap.style.transform = `scale(${avScale.toFixed(4)})`;

        // 3. Picker anchor rides cleanly with the expanding avatar shoulder
        const anchorShiftX = 8 * p;
        const anchorShiftY = -36 * p;
        pickerAnchor.style.transform = `translate3d(${anchorShiftX.toFixed(2)}px, ${anchorShiftY.toFixed(2)}px, 0)`;

        // 4. Outer Liquid Glass pill morph
        const shellW = COLLAPSED_W + (EXPANDED_W - COLLAPSED_W) * p;
        const shellH = COLLAPSED_H + (EXPANDED_H - COLLAPSED_H) * p;
        const collapsedScale = 1 + (spCollapsedScale.val - 1) * (1 - clampedP);

        pickerShell.style.width = Math.max(COLLAPSED_W * 0.92, shellW).toFixed(2) + "px";
        pickerShell.style.height = Math.max(COLLAPSED_H * 0.92, shellH).toFixed(2) + "px";
        pickerShell.style.transform = `scale(${collapsedScale.toFixed(4)})`;

        // Exact centered dot origin inside 72x72 borderless glass circle: (72 - 76)/2 = -2.00px
        const collapsedLeft = (COLLAPSED_W - ORB_SIZE) / 2;
        const collapsedTop = (COLLAPSED_H - ORB_SIZE) / 2;

        // 5. Render each of the 3 pure flat solid status circles
        orbButtons.forEach((orb, idx) => {
          const key = STATUSES[idx];
          const isCurrent = key === currentStatus;
          const hoverScale = orbHoverSprings[idx].val;

          const x = collapsedLeft + (ORB_X[idx] - collapsedLeft) * p;
          const y = collapsedTop + (ORB_Y - collapsedTop) * p;
          const baseScale = COLLAPSED_DOT_SCALE + (1 - COLLAPSED_DOT_SCALE) * p;
          const finalScale = Math.max(0.2, baseScale * (1 + (hoverScale - 1) * clampedP));

          const rawOpacity = isCurrent ? 1 : Math.max(0, Math.min(1, (clampedP - 0.04) * 1.45));
          const orbOpacity = Math.max(0, rawOpacity - (rawOpacity > 0.2 ? morphAlphaDip : 0));

          orb.style.zIndex = isCurrent ? "3" : "2";
          orb.style.opacity = orbOpacity.toFixed(3);
          orb.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) scale(${finalScale.toFixed(4)})`;
          orb.style.filter = motionBlur > 0.12 ? `blur(${motionBlur.toFixed(2)}px)` : "none";

          const iconP = Math.max(0, Math.min(1, (clampedP - 0.25) / 0.65));
          const svg = orb.querySelector("svg");
          if (svg) {
            svg.style.opacity = iconP.toFixed(3);
            svg.style.transform = `scale(${(0.55 + 0.45 * iconP).toFixed(3)})`;
          }
        });

        // 6. Floating Liquid Glass tooltip pill
        const tipOp = Math.max(0, Math.min(1, spTipOpacity.val));
        const tipW = Math.max(60, spTipW.val);
        const tipLeft = spTipX.val - tipW / 2;
        const tipBlur = (1 - tipOp) * 4;

        tooltipPill.style.width = tipW.toFixed(2) + "px";
        tooltipPill.style.opacity = tipOp.toFixed(3);
        tooltipPill.style.transform = `translate3d(${tipLeft.toFixed(2)}px, ${spTipY.val.toFixed(2)}px, 0)`;
        tooltipPill.style.filter = tipBlur > 0.1 ? `blur(${tipBlur.toFixed(2)}px)` : "none";
      }

      function tick(now) {
        const rawDt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        const steps = rawDt > 0.012 ? 2 : 1;
        const dt = rawDt / steps;
        let moving = false;

        for (let s = 0; s < steps; s++) {
          moving = stepSpring(spOpen, dt) || moving;
          moving = stepSpring(spCollapsedScale, dt) || moving;
          moving = stepSpring(spTipOpacity, dt) || moving;
          moving = stepSpring(spTipY, dt) || moving;
          moving = stepSpring(spTipX, dt) || moving;
          moving = stepSpring(spTipW, dt) || moving;
          for (let i = 0; i < orbHoverSprings.length; i++) {
            moving = stepSpring(orbHoverSprings[i], dt) || moving;
          }
        }

        renderFrame();

        if (moving) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
        }
      }

      collapsedTrigger.addEventListener("pointerenter", () => {
        if (!isOpen) {
          spCollapsedScale.target = 1.06;
          ensureLoop();
        }
      });

      collapsedTrigger.addEventListener("pointerleave", () => {
        if (!isOpen) {
          spCollapsedScale.target = 1;
          ensureLoop();
        }
      });

      collapsedTrigger.addEventListener("pointerdown", () => {
        if (!isOpen) {
          spCollapsedScale.target = 0.94;
          ensureLoop();
        }
      });

      collapsedTrigger.addEventListener("click", (e) => {
        e.stopPropagation();
        openPicker();
      });

      orbButtons.forEach((orb, idx) => {
        const key = STATUSES[idx];

        orb.addEventListener("pointerenter", () => {
          if (!isOpen) return;
          orbHoverSprings[idx].target = 1.07;
          updateTooltipTarget(key);
        });

        orb.addEventListener("pointerleave", () => {
          orbHoverSprings[idx].target = 1;
          ensureLoop();
        });

        orb.addEventListener("pointerdown", () => {
          if (!isOpen) return;
          orbHoverSprings[idx].target = 0.94;
          ensureLoop();
        });

        orb.addEventListener("focus", () => {
          if (!isOpen) return;
          orbHoverSprings[idx].target = 1.07;
          updateTooltipTarget(key);
        });

        orb.addEventListener("blur", () => {
          orbHoverSprings[idx].target = 1;
          ensureLoop();
        });

        orb.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!isOpen) return;
          closePicker(key);
        });
      });

      pickerShell.addEventListener("pointerleave", () => {
        if (isOpen) {
          updateTooltipTarget(null);
        }
      });

      document.addEventListener("click", (e) => {
        if (isOpen && !pickerShell.contains(e.target)) {
          closePicker(null);
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && isOpen) {
          closePicker(null);
          collapsedTrigger.focus();
        }
      });

      window.addEventListener("resize", () => {
        renderFrame();
      });

      renderFrame();

      window.__statusPicker = {
        open: openPicker,
        close: closePicker,
        hover: updateTooltipTarget,
        getStatus: () => currentStatus,
        isOpen: () => isOpen
      };
    })();
  </script>
</body>
</html>
