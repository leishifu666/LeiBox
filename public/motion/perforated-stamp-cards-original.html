<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calm Co-Pilot — Perforated Stamp Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #111111;
      color: #12120d;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      user-select: none;
    }

    .viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      perspective: 1400px;
    }

    /* Exact 1024x576 design canvas, scaled cleanly to fit any viewport */
    .stage {
      width: 1024px;
      height: 576px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      flex-shrink: 0;
    }

    .cards-row {
      display: flex;
      align-items: center;
      gap: 56px;
      /* Exact vertical offset: y=85 to y=490 -> 85 top, 86 bottom -> -0.5px from exact center */
      transform: translateY(-0.5px);
    }

    .card-slot {
      width: 246px;
      height: 406px;
      position: relative;
      perspective: 1000px;
      cursor: pointer;
    }

    .stamp-wrap {
      width: 246px;
      height: 406px;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform, filter;
      filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0));
    }

    .stamp-card {
      width: 246px;
      height: 406px;
      position: relative;
      background-color: #f3f3e7;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      mask-image: url(#stamp-mask);
      -webkit-mask-image: url(#stamp-mask);
      mask-size: 246px 406px;
      -webkit-mask-size: 246px 406px;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
    }

    /* Subtle paper grain & tactile sheen (invisible at rest, emerges subtly on hover) */
    .stamp-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      background: radial-gradient(
        circle at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 245, 0.22) 0%,
        rgba(255, 255, 245, 0.0) 62%
      );
      transition: opacity 0.35s ease;
    }

    .card-slot:hover .stamp-sheen {
      opacity: 1;
    }

    .panel-paper {
      width: 246px;
      height: 203px;
      position: relative;
      background-color: #f3f3e7;
      flex-shrink: 0;
    }

    .panel-art {
      width: 246px;
      height: 203px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background-color: #222222;
    }

    .panel-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    /* Brand Logo SVG */
    .brand-logo {
      position: absolute;
      width: 33px;
      height: 19px;
      display: block;
    }

    /* Card 1 & 3 top bar */
    .card-1 .brand-logo,
    .card-3 .brand-logo {
      left: 20px;
      top: 29px;
    }

    /* Card 2 bottom bar */
    .card-2 .brand-logo {
      left: 20px;
      bottom: 30px;
    }

    /* Index number 01 / 02 / 03 */
    .card-index {
      position: absolute;
      font-family: 'Inter Light', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 26.5px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #242420;
      font-variant-numeric: tabular-nums;
    }

    .card-1 .card-index,
    .card-3 .card-index {
      right: 21px;
      top: 26px;
    }

    .card-2 .card-index {
      right: 21px;
      bottom: 27px;
    }

    /* Text blocks */
    .text-block {
      position: absolute;
    }

    .card-1 .text-block {
      left: 21px;
      top: 104px;
    }

    .card-2 .text-block {
      left: 15px;
      top: 19px;
    }

    .card-3 .text-block {
      left: 21px;
      top: 101px;
    }

    .headline {
      font-size: 19.6px;
      font-weight: 600;
      line-height: 23.2px;
      letter-spacing: -0.028em;
      color: #13130e;
      margin-bottom: 6.5px;
    }

    .card-2 .headline {
      font-size: 20px;
      line-height: 23.5px;
      margin-bottom: 7.5px;
    }

    .card-3 .headline {
      font-size: 20px;
      line-height: 23.2px;
      margin-bottom: 8px;
    }

    .body-copy {
      font-size: 11.4px;
      font-weight: 400;
      line-height: 14px;
      letter-spacing: -0.012em;
      color: #6b6b5e;
    }

    .card-2 .body-copy {
      line-height: 14.2px;
    }

    .card-3 .body-copy {
      line-height: 14.2px;
    }

    /* Hidden SVG defs */
    .svg-defs {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @media (max-width: 560px) {
      html, body {
        overflow-y: auto;
      }
      .viewport {
        height: auto;
        min-height: 100%;
        padding: 32px 16px;
      }
      .stage {
        width: auto;
        height: auto;
        transform: none !important;
      }
      .cards-row {
        flex-direction: column;
        gap: 32px;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <!-- Procedural Postage Stamp Perforation Mask (246 x 406) -->
  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <mask id="stamp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="246" height="406">
        <rect x="0" y="0" width="246" height="406" fill="#ffffff" />
        <g id="stamp-holes" fill="#000000"></g>
      </mask>
    </defs>
  </svg>

  <main class="viewport">
    <div class="stage" id="stage">
      <div class="cards-row">
        <!-- Card 01 -->
        <article class="card-slot card-1" data-card="0" tabindex="0" aria-label="01 Your calm, Personal co-pilot.">
          <div class="stamp-wrap">
            <div class="stamp-card">
              <div class="stamp-sheen"></div>

                  <polygon points="17.8,0 32.5,8.2 17.8,8.2" fill="#13130e" />
                  <polygon points="0,10.8 15.2,10.8 0,19" fill="#13130e" />
                  <polygon points="17.8,10.8 33,10.8 33,19" fill="#13130e" />

        holesGroup.appendChild(c);
      }

      // Top & bottom edges: 21 holes from x=2.3 to x=247.5 (20 teeth)
      for (var i = 0; i <= 20; i++) {
        var x = 2.3 + i * pitch;
        addHole(x, -offsetOut);
        addHole(x, H + offsetOut);
      }

      // Left & right edges: 33 holes from y=9.0 to y=401.3 (33 teeth)
      for (var j = 0; j < 33; j++) {
        var y = 9.0 + j * pitch;
        addHole(-offsetOut, y);
        addHole(W + offsetOut, y);
      }

      // 2. Responsive stage scaling (exact 1:1 at 1024x576, fluid on any viewport)
      var stage = document.getElementById('stage');
      function updateScale() {
        if (window.innerWidth <= 560) {
          stage.style.transform = 'none';
          return;
        }
        var scaleX = window.innerWidth / 1024;
        var scaleY = window.innerHeight / 576;
        var scale = Math.min(scaleX, scaleY);
        // Clamp slight upscale on very large monitors so cards stay crisp and balanced
        scale = Math.min(scale, 1.45);
        if (Math.abs(scale - 1) < 0.002) {
          stage.style.transform = 'none';
        } else {
          stage.style.transform = 'scale(' + scale.toFixed(4) + ')';
        }
      }
      updateScale();
      window.addEventListener('resize', updateScale);

      // 3. Tactile spring-damper hover physics (0% deviation at rest)
      var slots = Array.prototype.slice.call(document.querySelectorAll('.card-slot'));
      var states = slots.map(function (slot) {
        return {
          slot: slot,
          wrap: slot.querySelector('.stamp-wrap'),
          sheen: slot.querySelector('.stamp-sheen'),
          rx: 0, ry: 0, ty: 0, sc: 1, sh: 0,
          vrx: 0, vry: 0, vty: 0, vsc: 0, vsh: 0,
          trx: 0, try_: 0, tty: 0, tsc: 1, tsh: 0,
          active: false
        };
      });

      var rafId = null;
      var lastTime = 0;

      function startLoop() {
        if (rafId !== null) return;
        lastTime = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      function stepSpring(val, vel, target, stiffness, damping, dt) {
        var force = (target - val) * stiffness;
        vel = (vel + force * dt) * Math.exp(-damping * dt);
        val += vel * dt;
        return [val, vel];
      }

      function tick(now) {
        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var anyMoving = false;

        for (var k = 0; k < states.length; k++) {
          var s = states[k];
          var r1 = stepSpring(s.rx, s.vrx, s.trx, 180, 14, dt);
          var r2 = stepSpring(s.ry, s.vry, s.try_, 180, 14, dt);
          var r3 = stepSpring(s.ty, s.vty, s.tty, 200, 15, dt);
          var r4 = stepSpring(s.sc, s.vsc, s.tsc, 200, 15, dt);
          var r5 = stepSpring(s.sh, s.vsh, s.tsh, 160, 14, dt);

          s.rx = r1[0]; s.vrx = r1[1];
          s.ry = r2[0]; s.vry = r2[1];
          s.ty = r3[0]; s.vty = r3[1];
          s.sc = r4[0]; s.vsc = r4[1];
          s.sh = r5[0]; s.vsh = r5[1];

          var settled =
            Math.abs(s.rx - s.trx) < 0.01 && Math.abs(s.vrx) < 0.01 &&
            Math.abs(s.ry - s.try_) < 0.01 && Math.abs(s.vry) < 0.01 &&
            Math.abs(s.ty - s.tty) < 0.01 && Math.abs(s.vty) < 0.01 &&
            Math.abs(s.sc - s.tsc) < 0.0005 && Math.abs(s.vsc) < 0.0005 &&
            Math.abs(s.sh - s.tsh) < 0.005 && Math.abs(s.vsh) < 0.005;

          if (settled && !s.active && s.trx === 0 && s.try_ === 0 && s.tty === 0 && s.tsc === 1) {
            s.rx = 0; s.ry = 0; s.ty = 0; s.sc = 1; s.sh = 0;
            s.wrap.style.transform = '';
            s.wrap.style.filter = 'drop-shadow(0 0 0 rgba(0, 0, 0, 0))';
          } else {
            anyMoving = true;
            s.wrap.style.transform =
              'translateY(' + s.ty.toFixed(2) + 'px) ' +
              'rotateX(' + s.rx.toFixed(2) + 'deg) ' +
              'rotateY(' + s.ry.toFixed(2) + 'deg) ' +
              'scale(' + s.sc.toFixed(4) + ')';
            var shadowY = (s.sh * 22).toFixed(1);
            var shadowBlur = (s.sh * 28).toFixed(1);
            var shadowAlpha = (s.sh * 0.55).toFixed(3);
            s.wrap.style.filter =
              'drop-shadow(0 ' + shadowY + 'px ' + shadowBlur + 'px rgba(0, 0, 0, ' + shadowAlpha + '))';
          }
        }

        if (anyMoving) {
          rafId = requestAnimationFrame(tick);
        } else {
          rafId = null;
        }
      }

      states.forEach(function (s) {
        s.slot.addEventListener('pointermove', function (e) {
          var rect = s.slot.getBoundingClientRect();
          var nx = (e.clientX - rect.left) / rect.width;
          var ny = (e.clientY - rect.top) / rect.height;
          s.active = true;
          s.trx = (0.5 - ny) * 7.5;
          s.try_ = (nx - 0.5) * 7.5;
          s.tty = -6;
          s.tsc = 1.022;
          s.tsh = 1;
          s.sheen.style.setProperty('--mx', (nx * 100).toFixed(1) + '%');
          s.sheen.style.setProperty('--my', (ny * 100).toFixed(1) + '%');
          startLoop();
        });

        s.slot.addEventListener('pointerleave', function () {
          s.active = false;
          s.trx = 0;
          s.try_ = 0;
          s.tty = 0;
          s.tsc = 1;
          s.tsh = 0;
          startLoop();
        });

        s.slot.addEventListener('focus', function () {
          s.active = true;
          s.tty = -5;
          s.tsc = 1.018;
          s.tsh = 0.85;
          startLoop();
        });

        s.slot.addEventListener('blur', function () {
          s.active = false;
          s.trx = 0;
          s.try_ = 0;
          s.tty = 0;
          s.tsc = 1;
          s.tsh = 0;
          startLoop();
        });
      });
    })();
  </script>
</body>
</html>
