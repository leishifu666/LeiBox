.pixel-switch {
  position: relative;
  width: 520px;
  height: 272px;
  padding: 0;
  border: 0;
  border-radius: 86px;
  background: linear-gradient(180deg, var(--track-top), var(--track-bottom));

.pixel-switch[data-dragging] { cursor: grabbing; }
.pixel-switch:focus-visible { outline: 2px solid var(--focus); }
.pixel-switch > * { pointer-events: none; }

.pixel-knob {
  position: absolute;
  display: block;
  border-radius: 69px;
  background: linear-gradient(180deg, var(--knob-top), var(--knob-bottom));
  box-shadow: inset 0 0 0 1px var(--knob-rim), inset 0 0 5px #ffffff2e,

}

.pixel-effects {
  position: absolute;
  display: block;
  width: 800px;
  height: 552px;
  left: -140px;
  top: -140px;
}

.pixel-glass {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.pixel-scene[data-glass-renderer] .pixel-switch {
  background: transparent;
  box-shadow: none;
}

.pixel-scene[data-glass-renderer] .pixel-knob { visibility: hidden; }
