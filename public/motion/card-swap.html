  display: grid;
  min-height: var(--motion-height, 350px);
  place-items: center;
  background: #f4f4f4;
  font-family: Inter, system-ui, sans-serif;
}

.csw-stack {
  position: relative;
  width: 360px;
  height: 350px;
}

.csw-stage {
  position: absolute;
  top: 73px;
  left: 31px;
  width: 196px;
  height: 246px;
  perspective: 850px;
  perspective-origin: 149px 102px;
}

.csw-card {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  padding: 0;
  border: 5px solid #fdfbf6;
  border-radius: 15px;
  background: #343a35;
  color: white;
  box-shadow: 0 2px 4px #211b161c, 0 9px 18px #211b1630;
  text-align: left;
  font: inherit;
  transform: var(--slot);
  transition: transform 540ms cubic-bezier(.22, .77, .23, 1);
  pointer-events: none;
  user-select: none;
}

.csw-card[data-front] {
  pointer-events: auto;
  touch-action: none;
  cursor: grab;
}

.csw-card[data-dragging] {
  transition: none;
  cursor: grabbing;
}

.csw-card:focus-visible {
  outline: 2px solid #225cfa;
  outline-offset: 4px;
}

.csw-photo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.csw-tag {
  position: absolute;
  inset: auto 0 0;
  padding: 28px 12px 11px;
  background: linear-gradient(transparent, #101711cc);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.25;
  pointer-events: none;
}
