/* The selection is the ground: its fill and glyphs occlude every plant. */
.sf-article{position:relative;z-index:1;width:658px;margin:0 auto;padding:52px 0 42px;user-select:text;-webkit-user-select:text;touch-action:pan-y}
.sf-article h1{margin:0 0 32px;font:400 72px/80px Georgia,'Times New Roman',serif;letter-spacing:-3px}
.sf-article p{margin:0 0 24px;font:400 21.5px/36px 'Times New Roman',Times,serif;letter-spacing:0}
.sf-article p:last-of-type{margin-bottom:0}
.sf-article ::selection,.sf-article::selection{background:#2fca4e;color:#fff}
.sf-article [tabindex]:focus{outline:none}
.sf-article [tabindex]:focus-visible{outline:2px solid #25833c;outline-offset:6px;border-radius:2px}
.sf-canvas{position:absolute;z-index:0;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.sf-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
`,Ae='<main class="sf-scene selection-flower-demo notranslate" translate="no" aria-label="Text selection flowers"><article class="sf-article" aria-label="Select any text to grow flowers"><h1 tabindex="0">Select any of this and<br>watch it flower.</h1><p tabindex="0" aria-label="Paragraph 1. Select text or press Enter to grow flowers.">Drag across a line. Every character the selection swallows puts something in the ground behind it \u2014 a stem finding its angle, a leaf turning over, a head of petals opening one at a time.</p><p tabindex="0" aria-label="Paragraph 2. Select text or press Enter to grow flowers.">Nothing here is placed by hand. A seeded generator picks the family, the length, the bend of every joint, the side each leaf takes and how far it swings out. The same rules run every time; the results never repeat.</p><p tabindex="0" aria-label="Paragraph 3. Select text or press Enter to grow flowers."><em>Let go, and it grows backwards.</em> Petals fold into the bud, leaves close along their attachment points, stems retract into the point they came from. Nothing dissolves \u2014 it simply un-grows.</p><p tabindex="0" aria-label="Paragraph 4. Select text or press Enter to grow flowers.">Only a highlight plants anything. The cursor can do it too, if you turn it on.</p></article><canvas class="sf-canvas" aria-hidden="true"></canvas><span class="sf-live sf-sr" role="status" aria-live="polite"></span><span class="sf-sr">Drag to select text and grow flowers. Release to retract. Focus a paragraph and press Enter or Space, Shift with arrow keys to extend, or Escape to clear. Touch: tap or long-press text.</span></main>';function Le(B,x={}){return Ee(B,x,Ce,Ae)}var Fe=Le(document.getElementById("selection-flower-demo"));window.addEventListener("pagehide",()=>Fe.destroy(),{once:!0});requestAnimationFrame(()=>requestAnimationFrame(()=>{document.body.dataset.motionReady="true"}));})();
