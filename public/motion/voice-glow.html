.voice-glow-scene {
  display:grid;
  place-items:center;
  width:min(100%,500px);
  min-height:236px;
  padding:18px;

}
.voice-glow-host {width:min(100%,390px);min-width:0}
.voice-glow-host[data-layout="pill"] {width:min(100%,194px)}
.voice-glow-host[data-layout="mobile"] {width:min(100%,272px)}
.voice-glow-device {
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:18px;
  min-height:86px;
  border-radius:19px;
  background:#f5f5f5;
  color:#111;
}
[data-layout="pill"] .voice-glow-device {min-height:54px;padding:12px 16px;border-radius:28px}
[data-layout="mobile"] .voice-glow-device {align-items:flex-end;min-height:186px;border-radius:24px}
.voice-glow-label {position:relative;z-index:1;display:grid;gap:3px;min-width:0;line-height:1.25}
.voice-glow-label strong {font-size:14px;font-weight:600;overflow-wrap:anywhere}
.voice-glow-label small {font-size:12px;color:#646464}
.voice-glow-indicator {
  position:relative;
  z-index:1;
  flex:0 0 auto;
  align-self:center;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#87899c;
}
[data-layout="mobile"] .voice-glow-indicator {align-self:flex-end;margin-bottom:19px}
[data-voice-state="listening"] .voice-glow-indicator {background:#239364}
[data-voice-state="processing"] .voice-glow-indicator {background:#7754c6}
@media (max-width: 360px) {
  .voice-glow-scene { min-height: 200px; padding: 8px; }

  color-scheme: light;
  font: 14px/1.4 system-ui, sans-serif;
}

.library-visual {
  display: grid;
  place-items: center;
  width: 100%;
  min-width: 0;
  flex: 1;
}

.library-demo[data-preview=true] .library-controls,
.library-demo[data-controls=false] .library-controls {
  display: none;
}

.library-controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-items: end;
  gap: 12px 18px;
  width: min(100%, 560px);
  margin: 0;
  padding-top: 12px;
  border-top: 1px solid #ededed;
}

.library-field {
  display: grid;
  min-width: 0;
  max-width: 100%;
  gap: 5px;
  padding: 0;
  margin: 0;
  border: 0;
  color: #646464;
  font: 500 12px/1.35 system-ui, sans-serif;
}

.library-field legend { margin-bottom: 5px; padding: 0; }
.library-segments {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}
.library-segments label { position: relative; display: grid; cursor: pointer; }
.library-segments input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: inherit; }
.library-segments span,
.library-controls > button,
.library-select-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  max-width: 100%;
  padding: 4px 8px;
  border: 0;
  border-radius: 6px;
  background: #f4f4f4;
  color: #111;
  font: 500 13px/1.35 system-ui, sans-serif;
}
.library-segments input:checked + span,
.library-controls > button[aria-pressed=true] { background: #111; color: #fff; }
.library-segments input:disabled + span { opacity: .55; }
.library-segments label:has(:disabled) { cursor: default; }
.library-controls > button, .library-select-trigger { cursor: pointer; }
.library-controls :is(button, input):disabled { cursor: default; }
.library-controls > button:disabled, .library-select-trigger:disabled { opacity: .55; }
.library-select-trigger {
  justify-content: space-between;
  gap: 10px;
  min-width: 88px;
  background: #fff;
  box-shadow: inset 0 0 0 1px #e5e5e5;
}
.library-select-trigger svg, .library-select-item svg { display: block; }
.library-select-positioner { z-index: 8; }
.library-select-popup {
  min-width: var(--anchor-width);
  max-height: min(248px, var(--available-height));
  overflow-y: auto;
  overscroll-behavior: contain;
  outline: none;
  padding: 4px;
  border-radius: 9px;
  background: #fff;
  box-shadow: 0 4px 16px #0002;
  color: #111;
  font: 500 13px/1.35 system-ui, sans-serif;
}
.library-select-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 32px;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  outline: none;
}
.library-select-item[data-highlighted], .library-select-trigger[data-popup-open] { background: #f4f4f4; }
.library-range-row { display: flex; align-items: center; gap: 6px; }
.library-range-value { min-width: 3ch; color: #111; font-variant-numeric: tabular-nums; }
.library-controls input[type=range] { width: 86px; min-height: 32px; margin: 0; accent-color: #111; }
.library-demo :is(button, input):focus-visible,
.library-segments input:focus-visible + span {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}
.library-demo[data-reduced=true] :is(.library-visual, .library-visual *) {
  animation-play-state: paused !important;
  transition-duration: 0s !important;
}

@media (max-width: 360px) {
  .library-demo { padding: 12px; gap: 12px; }
  .library-controls { gap: 8px 12px; }
}
