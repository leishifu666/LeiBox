# Include inside the leibox.pantoria.cn server block after publishing out/.
# This also works with the older Node preview: Nginx serves these assets itself.
location ^~ /assets/motion/ {
    root /opt/Project/leibox/out;
    try_files $uri =404;
    error_page 404 = @leibox_missing_motion;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    etag on;
    add_header Cache-Control "public,max-age=31536000,immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location @leibox_missing_motion {
    add_header Cache-Control "no-store" always;
    return 404;
}
